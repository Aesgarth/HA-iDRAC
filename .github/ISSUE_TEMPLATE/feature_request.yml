name: Feature Request
description: Suggest an enhancement, new sensor, or support for another Dell server model
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Description
      description: What would you like to see added or improved?
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Server Model & iDRAC Generation (if applicable)
      placeholder: "e.g. PowerEdge T430, iDRAC 8"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context or Sample Output
      description: |
        If requesting support for new IPMI or SNMP sensors, please include sample output from:
        `IPMI_PASSWORD='<your_password>' ipmitool -I lanplus -H <idrac_ip> -U <username> -E sdr elist`
        (Be sure to remove any passwords, SNMP community strings, or service tags.)
      render: text
    validations:
      required: false

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon_dir:
          - ha-idrac-controller-dev
          - ha-idrac-standard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r ${{ matrix.addon_dir }}/app/requirements.txt
      - name: Run tests
        env:
          ADDON_DIR: ${{ matrix.addon_dir }}
        run: python -m pytest -q
